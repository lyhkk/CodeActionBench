# demo_clean for the dual-arm aloha-agilex embodiment (lift_pot is bimanual).
# Identical to demo_clean.yml except `embodiment` — kept separate so the shared demo_clean.yml
# (currently [piper]) is untouched. Used for the EXP-004b A/B/C tap_workflow lift_pot eval,
# matching the baseline 20260526_004632 (demo_clean settings + aloha-agilex).
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: Large_D435  # 640×480 default; D435 remains available for explicit 320×240 runs.
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
eval_video_dense_freq: 2
