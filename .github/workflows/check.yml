name: Public source checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - name: Explain changes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: codeaction changes --base "$BASE_REVISION"
      - name: Check public source without private tests or credentials
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: src
        run: python tools/check_changes.py --base "$BASE_REVISION"
