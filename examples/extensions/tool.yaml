schema_version: 1
extensions:
  - kind: tool
    name: echo_value
    source: .
    files: [tool.py]
    entrypoint: tool:echo
    description: Return the supplied text.
    returns: An object containing the supplied text.
    input_schema:
      type: object
      properties: {value: {type: string}}
      required: [value]
      additionalProperties: false
    output_schema:
      type: object
      properties: {value: {type: string}}
      required: [value]
      additionalProperties: false
